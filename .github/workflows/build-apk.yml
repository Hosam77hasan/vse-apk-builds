name: Build APK

# ── The ONE definition of VSE's cloud build ──────────────────────────────────
# Read by `github_build.workflowYaml()` and written into the build repo (and
# into every per-build branch, so `workflow_dispatch` finds it on that ref).
#
# 1. A PERMANENT signing key, PER PROJECT, injected from the
#    `VSE_SIGNING_KEYS_JSON` repository secret. Signing material is never
#    committed to this public repository or uploaded as a workflow artifact.
# 2. A real identity and a version that only grows: `com.vse.<app>` instead of
#    `flutter create`'s `com.example.*` (which Google Play rejects), and a
#    versionCode read from `.vse-versions/<slug>` and incremented per build
#    (Android refuses an install whose versionCode does not increase).
# 3. An AAB next to the APK: the APK installs on the phone, the AAB is what
#    Google Play accepts for a new release.
on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'VSE project name'
        required: true
        default: 'vse-app'
      app_id:
        description: 'Android applicationId (com.vse.<slug>)'
        required: true
        default: 'com.vse.app'
      version_branch:
        description: 'Branch holding the public version counter'
        required: true
        default: 'main'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve the slug and the version
        env:
          # `gh` reads GH_TOKEN, and Actions does NOT export one by default —
          # without this every call fails silently and the versionCode counter
          # is never persisted.
          GH_TOKEN: ${{ github.token }}
          PROJECT_NAME: ${{ inputs.project_name }}
          VERSION_BRANCH: ${{ inputs.version_branch }}
        run: |
          set -e
          SLUG=$(printf '%s' "$PROJECT_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/_/g; s/^_+//; s/_+$//')
          [ -z "$SLUG" ] && SLUG="vse_app"
          # A Java package segment may not start with a digit.
          case "$SLUG" in [0-9]*) SLUG="app_$SLUG" ;; esac

          FILE=".vse-versions/${SLUG}"
          # The Contents API REQUIRES the sha of an EXISTING file on update:
          # without it the PUT answers 422 "sha wasn't supplied", so the
          # counter froze at 1 and every build after the first shipped the SAME
          # versionCode — which Android refuses to update over. Read content
          # and sha, then send the sha back only when the file already exists.
          SHA=$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${FILE}?ref=${VERSION_BRANCH}" \
            --jq '.sha' 2>/dev/null || true)
          CURRENT=$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${FILE}?ref=${VERSION_BRANCH}" \
            --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null || true)
          case "$CURRENT" in ''|*[!0-9]*) CURRENT=0 ;; esac
          NEXT=$((CURRENT + 1))
          PUT=(-X PUT "/repos/${GITHUB_REPOSITORY}/contents/${FILE}"
            -f message="vse: versionCode $NEXT for $SLUG"
            -f content="$(printf '%s' "$NEXT" | base64 -w0)"
            -f branch="${VERSION_BRANCH}")
          [ -n "$SHA" ] && PUT+=(-f sha="$SHA")
          if gh api "${PUT[@]}" >/dev/null 2>&1; then
            echo "🔢 versionCode $NEXT (stored for the next build)"
          else
            echo "⚠️ could not persist the counter — using $NEXT for this build"
          fi

          {
            echo "SLUG=$SLUG"
            echo "VERSION_CODE=$NEXT"
            echo "VERSION_NAME=1.0.${NEXT}"
          } >> "$GITHUB_ENV"
          echo "🆔 slug=$SLUG app_id=${{ inputs.app_id }} version=1.0.${NEXT}"

      - name: Cache the Gradle downloads
        # Every cloud build starts on a fresh runner, so Gradle re-downloads
        # the whole Android/Firebase dependency set before it can compile —
        # pure waiting for the user. Keyed on the project's own pubspec.yaml:
        # a different project (or a changed dependency set) gets its own cache,
        # an unchanged one reuses whatever is already there.
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare the Android platform
        # The sources pushed from the app are lib/ + the project shell — a
        # Flutter project WITHOUT android/. Generating it here keeps the phone
        # payload small and the build reproducible.
        #
        # `flutter create .` derives the package name from the DIRECTORY, and
        # the runner's directory is the repo's own name (`vse-apk-builds`) —
        # hyphens are illegal in a Dart package name, so the step aborted on
        # every build. The slug is already computed, is always a legal Dart
        # identifier, and is stable per project, so it is passed explicitly.
        # The real applicationId is stamped by the step below anyway.
        run: flutter create --project-name "$SLUG" --platforms=android --no-pub .

      - name: Restore the private release key from Actions secret
        env:
          SIGNING_KEYS_JSON: ${{ secrets.VSE_SIGNING_KEYS_JSON }}
          PROJECT_NAME: ${{ inputs.project_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import re

          project_name = os.environ['PROJECT_NAME'].strip().lower()
          slug = re.sub(r'[^a-z0-9]+', '_', project_name).strip('_')
          if not slug:
              slug = 'vse_app'
          if slug[0].isdigit():
              slug = 'app_' + slug

          raw = os.environ.get('SIGNING_KEYS_JSON', '')
          if not raw:
              raise SystemExit('Missing GitHub Actions secret VSE_SIGNING_KEYS_JSON')
          try:
              keys = json.loads(raw)
          except json.JSONDecodeError as error:
              raise SystemExit('VSE_SIGNING_KEYS_JSON is not valid JSON') from error
          entry = keys.get(slug) if isinstance(keys, dict) else None
          if not isinstance(entry, dict):
              raise SystemExit(
                  'No signing key configured in VSE_SIGNING_KEYS_JSON for project ' + slug
              )

          required = ('keystore_base64', 'store_password', 'key_password', 'key_alias')
          if any(not isinstance(entry.get(key), str) or not entry[key] for key in required):
              raise SystemExit('Signing-key entry is incomplete for project ' + slug)
          try:
              keystore = base64.b64decode(entry['keystore_base64'], validate=True)
          except (ValueError, base64.binascii.Error) as error:
              raise SystemExit('Signing keystore is invalid for project ' + slug) from error
          if not keystore:
              raise SystemExit('Signing keystore is empty for project ' + slug)
          if any('\n' in entry[key] or '\r' in entry[key] for key in required[1:]):
              raise SystemExit('Signing-key properties contain invalid line breaks')

          keystore_path = pathlib.Path('android/app/release.keystore')
          properties_path = pathlib.Path('android/key.properties')
          keystore_path.write_bytes(keystore)
          keystore_path.chmod(0o600)
          properties_path.write_text(
              'storePassword=' + entry['store_password'] + '\n'
              'keyPassword=' + entry['key_password'] + '\n'
              'keyAlias=' + entry['key_alias'] + '\n'
              'storeFile=release.keystore\n',
              encoding='utf-8',
          )
          properties_path.chmod(0o600)
          print('Private release key installed for ' + slug)
          PY

      - name: Set the identity, the version and release signing
        env:
          APP_ID: ${{ inputs.app_id }}
        run: |
          set -e
          python3 - <<'PY'
          import os, pathlib, re

          app_id = os.environ['APP_ID']
          code = os.environ['VERSION_CODE']
          name = os.environ['VERSION_NAME']
          p = pathlib.Path('android/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')

          # identity — `com.example.*` is rejected by Google Play.
          s = re.sub(r'namespace\s*=\s*"[^"]*"', 'namespace = "%s"' % app_id, s)
          s = re.sub(r'applicationId\s*=\s*"[^"]*"', 'applicationId = "%s"' % app_id, s)
          # flutter create writes flutter.versionCode/versionName — use REAL numbers.
          s = re.sub(r'versionCode\s*=\s*[^\n]+', 'versionCode = %s' % code, s)
          s = re.sub(r'versionName\s*=\s*[^\n]+', 'versionName = "%s"' % name, s)

          # flutter create places MainActivity in its generated `com.example`
          # package. The manifest resolves `.MainActivity` against namespace,
          # which is now APP_ID, so move and rename the Kotlin class as well.
          activity_files = list(pathlib.Path('android/app/src/main').rglob('MainActivity.kt'))
          if len(activity_files) != 1:
              raise SystemExit(
                  'Expected exactly one generated MainActivity.kt; found %d'
                  % len(activity_files)
              )
          activity = activity_files[0]
          activity_source = activity.read_text(encoding='utf-8')
          package_pattern = r'(?m)^package\s+[A-Za-z0-9_.]+\s*$'
          if not re.search(package_pattern, activity_source):
              raise SystemExit('Generated MainActivity.kt has no package declaration')
          activity_source = re.sub(
              package_pattern, 'package %s' % app_id, activity_source, count=1,
          )
          source_root = next(
              (parent for parent in activity.parents if parent.name in ('kotlin', 'java')),
              None,
          )
          if source_root is None:
              raise SystemExit('Could not locate the Android Kotlin source root')
          activity_target = source_root.joinpath(*app_id.split('.'), 'MainActivity.kt')
          activity_target.parent.mkdir(parents=True, exist_ok=True)
          if activity_target != activity and activity_target.exists():
              raise SystemExit('Refusing to overwrite an existing MainActivity.kt')
          activity_target.write_text(activity_source, encoding='utf-8')
          if activity_target != activity:
              activity.unlink()

          manifest = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          if not manifest.is_file() or not re.search(
              r'android:name\s*=\s*["\']\.MainActivity["\']',
              manifest.read_text(encoding='utf-8'),
          ):
              raise SystemExit('AndroidManifest.xml does not declare .MainActivity')
          if not re.search(
              r'namespace\s*=\s*["\']%s["\']' % re.escape(app_id), s,
          ):
              raise SystemExit('Gradle namespace does not match the MainActivity package')

          header = (
              'import java.util.Properties\n'
              'import java.io.FileInputStream\n\n'
              'val keystoreProperties = Properties()\n'
              'val keystorePropertiesFile = rootProject.file("key.properties")\n'
              'if (keystorePropertiesFile.exists()) {\n'
              '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
              '}\n\n'
          )
          if 'keystoreProperties' not in s:
              s = header + s

          signing = (
              '    signingConfigs {\n'
              '        create("release") {\n'
              '            keyAlias = keystoreProperties["keyAlias"] as String\n'
              '            keyPassword = keystoreProperties["keyPassword"] as String\n'
              '            storeFile = file(keystoreProperties["storeFile"] as String)\n'
              '            storePassword = keystoreProperties["storePassword"] as String\n'
              '        }\n'
              '    }\n'
          )
          before = s
          s = s.replace('    buildTypes {', signing + '    buildTypes {', 1)
          if s != before:
              s = s.replace(
                  'signingConfigs.getByName("debug")',
                  'signingConfigs.getByName("release")',
              )

          p.write_text(s, encoding='utf-8')
          print(
              '✅ identity=%s MainActivity=%s versionCode=%s versionName=%s'
              % (app_id, activity_target, code, name)
          )
          PY

      - name: Clean generated Flutter outputs
        timeout-minutes: 5
        run: flutter clean

      - name: Resolve generated Flutter dependencies
        timeout-minutes: 15
        run: flutter pub get --verbose

      - name: Patch legacy Android plugin metadata
        timeout-minutes: 5
        run: |
          # TWO AGP 8-era blockers that killed EVERY real cloud build, both
          # inside the pub-cache plugins the generated scaffold pulls in
          # (isar_flutter_libs, geocoding_android, …):
          #   1. `namespace` is now REQUIRED — old plugins ship only the
          #      manifest `package` attribute, so Gradle aborts during
          #      configuration with "Namespace not specified";
          #   2. a module compiled against android-33 dies in
          #      `checkReleaseAarMetadata` because its dependencies (androidx
          #      1.4.x) demand API 34+.
          # Fix both here, before Gradle runs: fill a missing namespace from
          # the plugin's own manifest, and align every plugin's compileSdk
          # with the app's (36 = what the pinned Flutter uses).
          python3 - <<'PY'
          import pathlib
          import re

          PUB = pathlib.Path.home() / '.pub-cache' / 'hosted' / 'pub.dev'

          # The app's own compileSdk — a literal in the generated Gradle file
          # when there is one, else Flutter's default (36).
          target = 36
          app_gradle = pathlib.Path('android/app/build.gradle.kts')
          if app_gradle.is_file():
              m = re.search(
                  r'compileSdk\s*[= ]\s*(\d+)',
                  app_gradle.read_text(encoding='utf-8'),
              )
              if m:
                  target = int(m.group(1))

          ns_fixed, sdk_fixed = [], []
          if PUB.is_dir():
              for gradle in sorted(PUB.glob('*/android/build.gradle*')):
                  try:
                      src = gradle.read_text(encoding='utf-8')
                  except (OSError, UnicodeDecodeError):
                      continue
                  block = re.search(r'(?m)^[ \t]*android[ \t]*\{', src)
                  if not block:
                      continue  # not an Android module (or an odd layout)
                  changed = False

                  # 1) missing `namespace` (Groovy `namespace "x"` vs Kotlin
                  #    `namespace = "x"` — the right spelling is picked below).
                  if not re.search(r'(?m)^[ \t]*namespace[ \t]*[=(\s]', src):
                      pkg_dir = gradle.parent.parent
                      ns = None
                      manifest = gradle.parent / 'src' / 'main' / 'AndroidManifest.xml'
                      if manifest.is_file():
                          m = re.search(
                              r'package\s*=\s*"([^"]+)"',
                              manifest.read_text(encoding='utf-8', errors='replace'),
                          )
                          if m:
                              ns = m.group(1)
                      if not ns:
                          # No manifest package to inherit: a legal, unique
                          # fallback namespace so the build still proceeds.
                          ident = re.sub(r'[^A-Za-z0-9_]', '_', pkg_dir.name).lower()
                          ns = 'vse.patched.' + ident
                      line = '    namespace "%s"\n' % ns
                      if gradle.suffix != '.gradle':
                          line = '    namespace = "%s"\n' % ns
                      src = src[:block.end()] + '\n' + line + src[block.end():]
                      ns_fixed.append('%s -> %s' % (pkg_dir.name, ns))
                      changed = True

                  # 2) compileSdk below what its own dependencies demand.
                  def bump(m):
                      if int(m.group(2)) >= target:
                          return m.group(0)
                      sdk_fixed.append('%s: %s -> %d'
                                       % (gradle.parent.parent.name, m.group(2), target))
                      return m.group(1) + str(target)

                  new = re.sub(
                      r'(?m)^([ \t]*compileSdk(?:Version)?[ \t]*[= ]?[ \t]*)(\d+)',
                      bump, src,
                  )
                  if new != src:
                      src, changed = new, True

                  if changed:
                      gradle.write_text(src, encoding='utf-8')
          print('🧩 legacy plugin patches — namespace: %s; compileSdk: %s'
                % (', '.join(ns_fixed) or 'none needed',
                   ', '.join(sdk_fixed) or 'none needed'))
          PY
      - name: Build the release APK
        timeout-minutes: 30
        run: flutter build apk --release

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          # One week: it is downloaded to the phone right after the build, and
          # GitHub storage is not a CDN.
          retention-days: 7

      - name: Build the Play bundle (best effort)
        timeout-minutes: 20
        continue-on-error: true
        run: flutter build appbundle --release

      - name: Upload the Play bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 7
